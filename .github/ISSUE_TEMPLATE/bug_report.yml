name: Bug report
description: A hook, demo, test or doc behaves incorrectly
labels: [bug]
body:
  - type: input
    id: entry
    attributes:
      label: Affected page or file
      description: Playground URL (e.g. `#/entry/use-debounce`) or source path.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behaviour.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS / Node version
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
